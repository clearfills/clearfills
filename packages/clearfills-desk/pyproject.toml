[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "clearfills-desk"
version = "0.1.0"
description = "Open-source 6-Agent AI Trading Desk OS powered by clearfills-firewall (clearfills.com)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "ClearFills / MLDSAI Inc.", email = "desk@mldsai.com" },
]
dependencies = [
    "clearfills-firewall>=0.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ibkr = [
    "ib_async>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
clearfills-desk = "clearfills_desk.cli:main"
clearfills-desk-mcp = "clearfills_desk.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clearfills_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
