name: Publish clearfills to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-clearfills:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/clearfills
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Build clearfills distribution
        run: |
          uv build
          uvx twine check dist/*
      - name: Publish clearfills to PyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
