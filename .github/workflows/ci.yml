name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unified clearfills tests
        run: |
          uv sync --extra dev
          uv run pytest -v
      - name: Run clearfills-firewall tests
        working-directory: packages/risk-firewall
        run: |
          uv sync --extra dev
          uv run pytest -v
      - name: Run clearfills-desk tests
        working-directory: packages/clearfills-desk
        run: |
          uv sync --extra dev
          uv pip install -e ../risk-firewall
          uv run --no-sync pytest -v
      - name: Build & verify unified clearfills wheel
        run: |
          uv build
          uvx twine check dist/*
